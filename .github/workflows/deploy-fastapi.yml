name: Deploy FastAPI To EC2
on:
  push:
    branches:
      - main

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create .env file
        run: echo "${{ secrets.FASTAPI_ENV }}" > ./graphrag-service/.env

      - name: Docker Image 생성
        run: docker build -t nodingo-fastapi-server ./graphrag-service

      - name: Docker Image에 Tag 생성
        run: docker tag nodingo-fastapi-server ${{ steps.login-ecr.outputs.registry }}/nodingo-fastapi-server:latest

      - name: ECR에 Docker Image Push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/nodingo-fastapi-server:latest

      # CD 시작 (EC2 원격 접속 및 배포)
      - name: SSH(원격)로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }} || true

            -- 이하는 데이터 싱크 에러 해결을 위한 초기화 및 타임아웃 보강 라인업 --
            # 기존 컨테이너 중지 및 삭제
            docker stop nodingo-fastapi-server || true
            docker rm nodingo-fastapi-server || true
            
            # 최신 이미지 풀링
            docker pull ${{ steps.login-ecr.outputs.registry }}/nodingo-fastapi-server:latest
            
            # 🌟 [수정] 대용량 GraphRAG 및 GPT 연산 병목을 뚫기 위해 uvicorn 타임아웃 인자(5분)를 강제 주입하여 실행!
            docker run -d \
              --name nodingo-fastapi-server \
              -p 8000:8000 \
              --restart unless-stopped \
              ${{ steps.login-ecr.outputs.registry }}/nodingo-fastapi-server:latest \
              python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300 --timeout-graceful-shutdown 300